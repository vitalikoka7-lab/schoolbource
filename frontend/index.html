<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScholarPass — Trouve ta bourse d'études</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background: linear-gradient(180deg,#eff6ff, #f8fafc); }
  .auth-card { width: 100%; max-width: 400px; }
  .switch { text-align:center; margin-top:14px; font-size:14px; color:#64748b; }
  .switch a { color:#2563eb; font-weight:600; text-decoration:none; }
  .error-box { background:#fef2f2; color:#b91c1c; padding:10px 12px; border-radius:10px; font-size:13.5px; margin-bottom:12px; display:none; }
</style>
</head>
<body>
  <div class="auth-card">
    <div style="text-align:center;margin-bottom:22px;">
      <img src="assets/logo.svg" alt="ScholarPass" height="34"/>
      <p style="color:#64748b;font-size:14px;margin-top:8px;">Trouve les bourses faites pour ton profil.</p>
    </div>

    <div class="card">
      <div style="display:flex;margin-bottom:18px;">
        <div class="tab active" id="tab-login" onclick="switchTab('login')">Connexion</div>
        <div class="tab" id="tab-register" onclick="switchTab('register')">Créer un compte</div>
      </div>

      <div id="error-box" class="error-box"></div>

      <form id="login-form">
        <label class="label">Email</label>
        <input class="input" type="email" id="login-email" required style="margin-bottom:12px;"/>
        <label class="label">Mot de passe</label>
        <input class="input" type="password" id="login-password" required style="margin-bottom:18px;"/>
        <button class="btn-primary" style="width:100%;" type="submit">Se connecter</button>
      </form>

      <form id="register-form" style="display:none;">
        <label class="label">Prénom</label>
        <input class="input" type="text" id="reg-firstname" required style="margin-bottom:12px;"/>
        <label class="label">Nom</label>
        <input class="input" type="text" id="reg-lastname" style="margin-bottom:12px;"/>
        <label class="label">Email</label>
        <input class="input" type="email" id="reg-email" required style="margin-bottom:12px;"/>
        <label class="label">Mot de passe</label>
        <input class="input" type="password" id="reg-password" required minlength="6" style="margin-bottom:18px;"/>
        <button class="btn-primary" style="width:100%;" type="submit">Créer mon compte</button>
      </form>
    </div>

    <p class="switch">En continuant, tu acceptes les conditions d'utilisation de ScholarPass.</p>
  </div>

  <script src="js/api.js"></script>
  <script>
    function switchTab(tab) {
      document.getElementById("tab-login").classList.toggle("active", tab === "login");
      document.getElementById("tab-register").classList.toggle("active", tab === "register");
      document.getElementById("login-form").style.display = tab === "login" ? "block" : "none";
      document.getElementById("register-form").style.display = tab === "register" ? "block" : "none";
      document.getElementById("error-box").style.display = "none";
    }

    function showError(msg) {
      const box = document.getElementById("error-box");
      box.textContent = msg;
      box.style.display = "block";
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const { token, user } = await Api.login({
          email: document.getElementById("login-email").value,
          password: document.getElementById("login-password").value,
        });
        Auth.setToken(token);
        Auth.setUser(user);
        window.location.href = "dashboard.html";
      } catch (err) {
        showError(err.message);
      }
    });

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const { token, user } = await Api.register({
          firstName: document.getElementById("reg-firstname").value,
          lastName: document.getElementById("reg-lastname").value,
          email: document.getElementById("reg-email").value,
          password: document.getElementById("reg-password").value,
        });
        Auth.setToken(token);
        Auth.setUser(user);
        window.location.href = "dashboard.html";
      } catch (err) {
        showError(err.message);
      }
    });

    // Si déjà connecté, redirige directement
    if (Auth.getToken()) window.location.href = "dashboard.html";
  </script>
</body>
</html>
