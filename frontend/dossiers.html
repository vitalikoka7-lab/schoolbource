<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mes Dossiers — ScholarPass</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="topbar"><h3 style="margin:0;">Mes Dossiers</h3></div>
    <div style="padding:24px;max-width:900px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <p style="color:#64748b;margin:0;">Gérez et suivez toutes vos candidatures.</p>
      </div>
      <div id="tabs" style="display:flex;margin-bottom:16px;"></div>
      <div id="list" style="display:flex;flex-direction:column;gap:12px;"></div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
Auth.requireAuth();
renderSidebar("dossiers.html");

const statusLabels = {
  en_preparation: { label: "En préparation", cls: "badge-orange" },
  soumis: { label: "Soumis", cls: "badge-blue" },
  en_cours: { label: "En cours", cls: "badge-blue" },
  accepte: { label: "Accepté", cls: "badge-green" },
  refuse: { label: "Refusé", cls: "badge-gray" },
};

let applications = [];
let activeFilter = "tous";

async function load() {
  applications = await Api.getApplications();
  renderTabs();
  renderList();
}

function renderTabs() {
  const counts = { tous: applications.length };
  Object.keys(statusLabels).forEach((k) => (counts[k] = applications.filter((a) => a.status === k).length));

  const tabs = [
    ["tous", `Tous (${counts.tous})`],
    ["en_preparation", `En préparation (${counts.en_preparation})`],
    ["soumis", `Soumis (${counts.soumis})`],
    ["en_cours", `En cours (${counts.en_cours})`],
    ["accepte", `Acceptés (${counts.accepte})`],
  ];

  document.getElementById("tabs").innerHTML = tabs.map(([key, label]) =>
    `<div class="tab ${activeFilter === key ? "active" : ""}" onclick="setFilter('${key}')">${label}</div>`
  ).join("");
}

function setFilter(key) { activeFilter = key; renderTabs(); renderList(); }

function renderList() {
  const filtered = activeFilter === "tous" ? applications : applications.filter((a) => a.status === activeFilter);
  const list = document.getElementById("list");

  if (!filtered.length) {
    list.innerHTML = `<p style="color:#94a3b8;">Aucun dossier pour l'instant. Ajoutez une bourse depuis la page "Bourses".</p>`;
    return;
  }

  list.innerHTML = filtered.map((a) => {
    const s = statusLabels[a.status] || statusLabels.en_preparation;
    return `
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:16px;">
        <div style="flex:1;">
          <div style="display:flex;align-items:center;gap:10px;">
            <span>🎓</span>
            <strong>${a.scholarshipTitle}</strong>
            <span class="badge ${s.cls}">${s.label}</span>
          </div>
          <p style="margin:6px 0 10px;color:#64748b;font-size:13px;">Dernière mise à jour : ${new Date(a.updatedAt).toLocaleDateString("fr-FR")}</p>
          <div class="progress-bar"><div class="progress-fill" style="width:${a.progress}%;"></div></div>
        </div>
        <span style="font-weight:700;color:#2563eb;">${a.progress}%</span>
      </div>
    `;
  }).join("");
}

load();
</script>
</body>
</html>
