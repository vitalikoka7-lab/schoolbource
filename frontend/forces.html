<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forces, Faiblesses et Objectifs — ScholarPass</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="topbar"><h3 style="margin:0;">Forces, Faiblesses et Objectifs</h3></div>
    <div style="padding:24px;max-width:800px;">
      <p style="color:#64748b;margin-top:0;">Aide-nous à mieux te connaître. Décris-toi librement ci-dessous, et Nova identifiera tes forces et axes d'amélioration.</p>

      <div class="card" style="margin-bottom:20px;">
        <label class="label">Parle-nous de toi : tes qualités, ce que tu aimes faire, tes projets extrascolaires...</label>
        <textarea class="input" id="free-text" rows="4" placeholder="Ex: Je suis quelqu'un d'organisé, j'aime relever de nouveaux défis, j'ai déjà dirigé un projet associatif..."></textarea>
        <button class="btn-primary" style="margin-top:10px;" onclick="analyze()">✨ Analyser avec Nova</button>
        <p id="analyze-status" style="font-size:13px;color:#64748b;margin-top:8px;"></p>
      </div>

      <div class="card">
        <div id="tabs" style="display:flex;margin-bottom:16px;"></div>
        <div id="content" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
Auth.requireAuth();
renderSidebar("forces.html");

let profile = null;
let active = "strengths";

const tabConfig = {
  strengths: { label: "Forces", icon: "💪" },
  weaknesses: { label: "Faiblesses", icon: "🎯" },
  improvements: { label: "À améliorer", icon: "📈" },
};

async function load() {
  profile = await Api.getProfile();
  renderTabs();
  renderContent();
}

function renderTabs() {
  document.getElementById("tabs").innerHTML = Object.entries(tabConfig).map(([key, cfg]) =>
    `<div class="tab ${active === key ? "active" : ""}" onclick="setTab('${key}')">${cfg.label}</div>`
  ).join("");
}

function setTab(key) { active = key; renderTabs(); renderContent(); }

function renderContent() {
  const items = profile[active] || [];
  const container = document.getElementById("content");

  if (!items.length) {
    container.innerHTML = `<p style="color:#94a3b8;grid-column:1/-1;">Rien à afficher pour l'instant — utilise l'analyse Nova ci-dessus.</p>`;
    return;
  }

  container.innerHTML = items.map((item) => `
    <div class="card" style="background:#f8fafc;">
      <strong>${tabConfig[active].icon} ${item.title}</strong>
      <p style="margin:6px 0 0;color:#64748b;font-size:13.5px;">${item.description}</p>
    </div>
  `).join("");
}

async function analyze() {
  const text = document.getElementById("free-text").value.trim();
  if (!text) return;
  const status = document.getElementById("analyze-status");
  status.textContent = "Nova analyse ta réponse...";

  try {
    const { raw } = await Api.analyzeStrengths(text);
    const parsed = JSON.parse(raw);
    profile.strengths = parsed.strengths || [];
    profile.weaknesses = parsed.weaknesses || [];
    profile.improvements = parsed.improvements || [];

    await Api.updateProfile("strengths", profile.strengths);
    await Api.updateProfile("weaknesses", profile.weaknesses);

    status.textContent = "✅ Analyse terminée.";
    renderContent();
  } catch (err) {
    status.textContent = "⚠️ L'analyse a échoué (vérifie la clé ANTHROPIC_API_KEY côté backend).";
  }
}

load();
</script>
</body>
</html>
