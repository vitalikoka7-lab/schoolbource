<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bourses — ScholarPass</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="topbar">
      <input class="input" style="max-width:360px;" id="search" placeholder="🔍 Rechercher une bourse..." />
    </div>
    <div style="padding:24px;max-width:1000px;">
      <h3 style="margin-top:0;">Toutes les bourses</h3>
      <div id="list" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;"></div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
Auth.requireAuth();
renderSidebar("scholarships.html");

async function load(query = "") {
  const scholarships = await Api.getScholarships(query ? `?search=${encodeURIComponent(query)}` : "");
  document.getElementById("list").innerHTML = scholarships.map((s) => `
    <div class="card">
      <h4 style="margin:0 0 4px;">${s.title}</h4>
      <p style="margin:0 0 8px;color:#64748b;font-size:13.5px;">${s.provider}</p>
      <p style="margin:0;font-size:13px;color:#64748b;">${s.levels.join(", ")} · 📍 ${s.country}</p>
      <p style="margin:6px 0 12px;font-size:12.5px;color:#94a3b8;">⏳ Date limite : ${new Date(s.deadline).toLocaleDateString("fr-FR")}</p>
      <button class="btn-primary" onclick="apply('${s.id}')">Créer un dossier</button>
    </div>
  `).join("") || "<p style='color:#94a3b8;'>Aucune bourse trouvée.</p>";
}

async function apply(scholarshipId) {
  await Api.createApplication(scholarshipId);
  window.location.href = "dossiers.html";
}

document.getElementById("search").addEventListener("input", (e) => load(e.target.value));
load();
</script>
</body>
</html>
