<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Créer / Modifier mon profil — ScholarPass</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="topbar"><h3 style="margin:0;">Créer / Modifier mon profil</h3></div>

    <div style="display:grid;grid-template-columns:220px 1fr;gap:24px;padding:24px;max-width:1100px;">
      <div>
        <div class="wizard-step active" data-step="0"><span class="dot">1</span> Informations personnelles</div>
        <div class="wizard-step" data-step="1"><span class="dot">2</span> Parcours académique</div>
        <div class="wizard-step" data-step="2"><span class="dot">3</span> Compétences</div>
        <div class="wizard-step" data-step="3"><span class="dot">4</span> Expériences</div>
        <div class="wizard-step" data-step="4"><span class="dot">5</span> Documents</div>
        <div class="wizard-step" data-step="5"><span class="dot">6</span> Objectifs</div>
      </div>

      <div class="card" id="step-content"></div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
Auth.requireAuth();
renderSidebar("profile.html");

let currentStep = 0;
let profile = null;
let education = [];

const steps = ["personalInfo", "education", "skills", "experiences", "documents", "goals"];

async function init() {
  profile = await Api.getProfile();
  education = profile.education || [];
  renderStep();
}

function goTo(step) {
  currentStep = step;
  document.querySelectorAll(".wizard-step").forEach((el, i) => {
    el.classList.toggle("active", i === step);
    el.classList.toggle("done", i < step);
  });
  renderStep();
}

document.querySelectorAll(".wizard-step").forEach((el) =>
  el.addEventListener("click", () => goTo(Number(el.dataset.step)))
);

function renderStep() {
  const container = document.getElementById("step-content");

  if (currentStep === 0) {
    const p = profile.personalInfo || {};
    container.innerHTML = `
      <h4 style="margin-top:0;">Informations personnelles</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div><label class="label">Prénom</label><input class="input" id="pi-firstName" value="${p.firstName || ""}"/></div>
        <div><label class="label">Âge</label><input class="input" type="number" id="pi-age" value="${p.age || ""}"/></div>
        <div><label class="label">Nationalité</label><input class="input" id="pi-nationality" value="${p.nationality || ""}"/></div>
        <div><label class="label">Pays de résidence</label><input class="input" id="pi-country" value="${p.country || ""}"/></div>
        <div><label class="label">Langue principale</label><input class="input" id="pi-mainLanguage" value="${p.mainLanguage || ""}"/></div>
        <div><label class="label">Autres langues</label><input class="input" id="pi-otherLanguages" value="${p.otherLanguages || ""}"/></div>
      </div>
      ${navButtons(true, false)}
    `;
    bindNav(async () => {
      await Api.updateProfile("personalInfo", {
        firstName: val("pi-firstName"), age: val("pi-age"), nationality: val("pi-nationality"),
        country: val("pi-country"), mainLanguage: val("pi-mainLanguage"), otherLanguages: val("pi-otherLanguages"),
      });
    });
  }

  if (currentStep === 1) {
    container.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h4 style="margin:0;">Parcours académique</h4>
        <button class="btn-primary" onclick="addEducation()">+ Ajouter une formation</button>
      </div>
      <div id="edu-list" style="margin-top:16px;display:flex;flex-direction:column;gap:12px;"></div>
      ${navButtons(true, true)}
    `;
    renderEducationList();
    bindNav(async () => { await Api.updateProfile("education", education); });
  }

  if (currentStep === 2) {
    const skills = (profile.skills || []).join(", ");
    container.innerHTML = `
      <h4 style="margin-top:0;">Compétences</h4>
      <label class="label">Liste tes compétences, séparées par des virgules (ex: Gestion de projet, Analyse financière, Excel)</label>
      <textarea class="input" id="skills-input" rows="4">${skills}</textarea>
      ${navButtons(true, true)}
    `;
    bindNav(async () => {
      const list = val("skills-input").split(",").map((s) => s.trim()).filter(Boolean);
      await Api.updateProfile("skills", list);
    });
  }

  if (currentStep === 3) {
    const exp = (profile.experiences || []).map(e => `${e.title} — ${e.organization} (${e.period || ""})`).join("\n");
    container.innerHTML = `
      <h4 style="margin-top:0;">Expériences</h4>
      <label class="label">Une expérience par ligne : Titre — Organisation (Période)</label>
      <textarea class="input" id="exp-input" rows="5">${exp}</textarea>
      ${navButtons(true, true)}
    `;
    bindNav(async () => {
      const lines = val("exp-input").split("\n").map((l) => l.trim()).filter(Boolean);
      const experiences = lines.map((line) => {
        const [rest, period] = line.split("(");
        const [title, organization] = rest.split("—").map((s) => (s || "").trim());
        return { title, organization, period: period ? period.replace(")", "").trim() : "" };
      });
      await Api.updateProfile("experiences", experiences);
    });
  }

  if (currentStep === 4) {
    container.innerHTML = `
      <h4 style="margin-top:0;">Documents</h4>
      <p style="color:#64748b;font-size:14px;">Glisse simplement ton bulletin, diplôme, CV ou certificat ici. L'agent Dossier lira automatiquement les informations utiles.</p>
      <input type="file" id="doc-file" class="input" />
      <select id="doc-type" class="input" style="margin-top:10px;max-width:220px;">
        <option value="bulletin">Bulletin</option>
        <option value="diplome">Diplôme</option>
        <option value="cv">CV</option>
        <option value="lettre">Lettre de motivation</option>
        <option value="certificat">Certificat</option>
        <option value="passeport">Passeport</option>
      </select>
      <div style="margin-top:12px;"><button class="btn-secondary" onclick="uploadDoc()">Téléverser</button></div>
      <div id="doc-status" style="margin-top:10px;font-size:13.5px;color:#16a34a;"></div>
      ${navButtons(true, true)}
    `;
    bindNav(async () => {});
  }

  if (currentStep === 5) {
    const g = profile.goals || {};
    container.innerHTML = `
      <h4 style="margin-top:0;">Objectifs</h4>
      <label class="label">Décris la vie que tu aimerais avoir dans 10 ans</label>
      <textarea class="input" id="goal-life" rows="4">${g.lifeIn10Years || ""}</textarea>
      <div id="onboarding-result" style="margin-top:10px;font-size:13.5px;color:#2563eb;"></div>
      ${navButtons(true, false, "Terminer")}
    `;
    bindNav(async () => {
      const lifeIn10Years = val("goal-life");
      await Api.updateProfile("goals", { ...g, lifeIn10Years });
      if (lifeIn10Years) {
        try {
          const { raw } = await Api.onboarding(lifeIn10Years);
          document.getElementById("onboarding-result").textContent = "✨ Nova a analysé ta réponse pour te recommander des bourses adaptées.";
        } catch (e) { /* silencieux si la clé API n'est pas configurée */ }
      }
      window.location.href = "dashboard.html";
    });
  }
}

function navButtons(showPrev, showNext, nextLabel) {
  return `
    <div style="display:flex;justify-content:space-between;margin-top:24px;">
      ${showPrev ? `<button class="btn-secondary" id="btn-prev">Précédent</button>` : "<span></span>"}
      <button class="btn-primary" id="btn-next">${nextLabel || "Suivant"}</button>
    </div>
  `;
}

function bindNav(onSave) {
  const prev = document.getElementById("btn-prev");
  const next = document.getElementById("btn-next");
  if (prev) prev.addEventListener("click", () => goTo(Math.max(0, currentStep - 1)));
  if (next) next.addEventListener("click", async () => {
    await onSave();
    if (currentStep < 5) goTo(currentStep + 1);
  });
}

function val(id) { return document.getElementById(id).value; }

function addEducation() {
  education.push({ degree: "", speciality: "", school: "", country: "", gpa: "", status: "En cours", startYear: "", endYear: "" });
  renderEducationList();
}

function removeEducation(i) {
  education.splice(i, 1);
  renderEducationList();
}

function renderEducationList() {
  const list = document.getElementById("edu-list");
  if (!list) return;
  list.innerHTML = education.map((e, i) => `
    <div class="card" style="background:#f8fafc;">
      <div style="display:flex;justify-content:space-between;">
        <strong>Formation ${i + 1}</strong>
        <span style="cursor:pointer;color:#dc2626;" onclick="removeEducation(${i})">🗑️</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
        <div><label class="label">Diplôme</label><input class="input" value="${e.degree}" onchange="education[${i}].degree=this.value"/></div>
        <div><label class="label">Spécialité</label><input class="input" value="${e.speciality}" onchange="education[${i}].speciality=this.value"/></div>
        <div><label class="label">Établissement</label><input class="input" value="${e.school}" onchange="education[${i}].school=this.value"/></div>
        <div><label class="label">Pays</label><input class="input" value="${e.country}" onchange="education[${i}].country=this.value"/></div>
        <div><label class="label">Moyenne / GPA</label><input class="input" value="${e.gpa}" onchange="education[${i}].gpa=this.value"/></div>
        <div><label class="label">Statut</label>
          <select class="input" onchange="education[${i}].status=this.value">
            <option ${e.status==="En cours"?"selected":""}>En cours</option>
            <option ${e.status==="Terminé"?"selected":""}>Terminé</option>
          </select>
        </div>
      </div>
    </div>
  `).join("") || "<p style='color:#94a3b8;'>Aucune formation ajoutée pour l'instant.</p>";
}

async function uploadDoc() {
  const fileInput = document.getElementById("doc-file");
  if (!fileInput.files.length) return;
  const fd = new FormData();
  fd.append("file", fileInput.files[0]);
  fd.append("type", document.getElementById("doc-type").value);
  try {
    await Api.uploadDocument(fd);
    document.getElementById("doc-status").textContent = "✅ Document téléversé avec succès.";
  } catch (err) {
    document.getElementById("doc-status").style.color = "#dc2626";
    document.getElementById("doc-status").textContent = "❌ " + err.message;
  }
}

init();
</script>
</body>
</html>
